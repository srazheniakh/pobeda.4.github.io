<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歴史 暗記トレーニング</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #4a90e2;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.2rem;
            color: #666;
            margin: 0 0 5px 0;
        }

        .progress {
            font-size: 0.9rem;
            color: #888;
        }

        /* 説明文のエエリア */
        .description-box {
            font-size: 1.1rem;
            line-height: 1.8;
            min-height: 120px;
            background: #fdfdfd;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            white-space: pre-wrap;
        }

        /* 答えのエリア */
        .answer-container {
            border-top: 2px dashed #ddd;
            padding-top: 20px;
            text-align: center;
        }

        .answer-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: #d9534f;
            min-height: 40px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden {
            visibility: hidden;
        }

        /* ボタン */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-show {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-show:hover {
            background-color: #357abd;
        }

        .btn-next {
            background-color: #5cb85c;
            color: white;
        }

        .btn-next:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>

<div class="container">
    <div>
        <header>
            <h1>歴史 暗記トレーニング</h1>
            <div class="progress" id="progress">問題 1 / 87</div>
        </header>

        <!-- 説明文 -->
        <div class="description-box" id="description">
            読み込み中...
        </div>
    </div>

    <!-- 一番下の答えと操作エリア -->
    <div class="answer-container">
        <div class="answer-box hidden" id="answer">
            <!-- ここに答えが表示されます -->
        </div>

        <div class="btn-group">
            <button class="btn-show" onclick="showAnswer()">答えを見る</button>
            <button class="btn-next" onclick="nextQuestion()">次の問題</button>
